<style>
  :root{
    --bg:#0a0a0d;
    --bg-2:#111114;
    --panel:#17171b;
    --panel-2:#1e1e23;
    --line:rgba(246,185,11,.18);
    --gold:#f6b90b;
    --gold-light:#ffd54a;
    --gold-dark:#c8900a;
    --white:#f5f5f2;
    --muted:#8d8d94;
    --danger:#e0524d;
    --success:#3fb383;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 14px 34px rgba(0,0,0,.55);
    --maxw:420px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1c1c16 0%, transparent 55%),
      var(--bg);
    color:var(--white);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:var(--maxw);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:22px 18px 14px;
    position:relative;
  }
  h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif; margin:0;}

  .screen{display:none; flex-direction:column; flex:1; animation:fadeIn .28s ease;}
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Home ---------- */
  .brand{
    display:flex; flex-direction:column; align-items:center;
    margin:8px 0 30px;
  }
  .brand img{
    width:132px; height:132px; object-fit:contain;
    filter:drop-shadow(0 8px 22px rgba(246,185,11,.25));
  }
  .brand .tag{
    color:var(--muted); font-size:13px; letter-spacing:.02em; margin-top:6px;
  }

  .menu{display:flex; flex-direction:column; gap:12px;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px;
    color:var(--bg); background:linear-gradient(180deg,var(--gold-light),var(--gold));
    border-radius:var(--radius-sm);
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 18px rgba(246,185,11,.22);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97); filter:brightness(.96);}
  .btn.secondary{
    background:var(--panel-2); color:var(--white);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .btn.ghost{
    background:transparent; color:var(--gold);
    border:1px solid var(--line);
    box-shadow:none; justify-content:center;
  }
  .btn .ico{
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .btn .label{flex:1; text-align:left;}
  .btn .chev{opacity:.5; font-size:14px;}

  .topbar{
    display:flex; align-items:center; gap:10px; margin-bottom:18px; min-height:32px;
  }
  .backbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--white); font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0;
  }
  .backbtn:active{filter:brightness(1.2);}
  .topbar h2{font-size:19px; flex:1;}

  .subtitle{color:var(--muted); font-size:14px; margin:0 0 18px; line-height:1.5;}

  /* ---------- Difficulty ---------- */
  .diff-grid{display:flex; flex-direction:column; gap:12px;}
  .diff-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    transition:border-color .12s ease, transform .12s ease;
  }
  .diff-card:active{transform:scale(.98);}
  .diff-card.selected{border-color:var(--gold);}
  .diff-card .dname{font-family:'Baloo 2'; font-weight:700; font-size:16px;}
  .diff-card .ddesc{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .diff-card .dot{width:10px;height:10px;border-radius:50%; background:var(--line); flex-shrink:0;}
  .diff-card.selected .dot{background:var(--gold);}

  /* ---------- Room / Join ---------- */
  .field{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:14px;
  }
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:8px; letter-spacing:.02em;}
  .field input{
    width:100%; background:transparent; border:none; outline:none; color:var(--white);
    font-family:'Baloo 2'; font-size:22px; letter-spacing:6px; text-transform:uppercase;
    text-align:center;
  }
  .field input::placeholder{color:#4a4a50; letter-spacing:4px;}
  .errmsg{color:var(--danger); font-size:13px; margin:-6px 0 12px; min-height:16px;}

  .waiting-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 20px; text-align:center; margin-bottom:16px;
  }
  .waiting-box .code{
    font-family:'Baloo 2'; font-size:40px; letter-spacing:8px; color:var(--gold);
    margin:10px 0 4px;
  }
  .waiting-box .hint{color:var(--muted); font-size:13px;}
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--gold);
    margin:14px auto 4px; animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .copybtn{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--gold);
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:'Inter';
  }
  .copybtn:active{filter:brightness(1.2);}

  /* ---------- Game screen ---------- */
  .game-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .modeinfo{display:flex; flex-direction:column;}
  .modeinfo .mtitle{font-family:'Baloo 2'; font-weight:700; font-size:16px;}
  .modeinfo .mcode{color:var(--muted); font-size:12px;}
  .headbtn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; color:var(--white);
  }
  .headbtn:active{filter:brightness(1.2);}

  .scorebar{
    display:flex; gap:10px; margin-bottom:16px;
  }
  .score-chip{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 12px; display:flex; align-items:center; gap:10px;
    transition:border-color .15s ease, background .15s ease;
  }
  .score-chip.active{border-color:var(--gold); background:var(--panel-2);}
  .score-chip .mark{width:22px; height:22px; flex-shrink:0;}
  .score-chip .who{font-size:12px; color:var(--muted);}
  .score-chip .who b{color:var(--white); display:block; font-family:'Baloo 2'; font-size:14px;}

  .status-line{
    text-align:center; font-size:14.5px; color:var(--muted); margin-bottom:14px; min-height:20px;
    font-weight:500;
  }
  .status-line.win{color:var(--gold); font-weight:700;}

  .board{
    width:100%; aspect-ratio:1/1;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:8px;
    background:var(--panel); padding:8px; border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .cell{
    background:var(--panel-2); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; overflow:hidden;
    transition:background .12s ease;
  }
  .cell:active{background:#26262c;}
  .cell.disabled{cursor:default;}
  .cell svg{width:56%; height:56%;}
  .cell.win{background:rgba(246,185,11,.16); animation:pulse 1s ease infinite;}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(246,185,11,.4);}50%{box-shadow:inset 0 0 0 4px rgba(246,185,11,.4);}}

  .gamefoot{display:flex; gap:10px; margin-bottom:6px;}
  .gamefoot .btn{flex:1; padding:13px;}

  .result-banner{
    text-align:center; background:var(--panel); border:1px solid var(--gold);
    border-radius:var(--radius-sm); padding:16px; margin-bottom:14px;
  }
  .result-banner .rtitle{font-family:'Baloo 2'; font-size:19px; font-weight:800; color:var(--gold);}
  .result-banner .rdesc{color:var(--muted); font-size:13px; margin-top:4px;}

  /* ---------- Ad slots ---------- */
  .ad-slot{
    margin-top:auto; padding-top:16px;
  }
  .ad-slot .ad-label{
    text-align:center; font-size:10px; letter-spacing:.08em; color:#54545a; margin-bottom:6px;
  }
  .ad-box{
    min-height:90px; border-radius:10px; border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    color:#4a4a50; font-size:12px;
  }

  .footer-note{
    text-align:center; color:#4a4a50; font-size:11px; margin-top:10px;
  }
</style>
</head>
